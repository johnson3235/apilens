{{- if not .Values.control.existingSecret }}
{{- if not .Values.control.token }}
{{- fail "Set control.existingSecret (recommended) or control.token" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.fullname" . }}
  labels: {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  APILENS_CONTROL_TOKEN: {{ .Values.control.token | quote }}
{{- end }}
