# Builds, tests and attaches the @apilens/next-sdk tarball to a GitHub Release.
#
# Release:  git tag next-sdk-v0.4.0 && git push origin next-sdk-v0.4.0
# The tag version must match sdks/next/package.json. Nothing is published to npm.
name: next-sdk release

on:
  push:
    tags: ['next-sdk-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apilens/next-sdk typecheck
      - run: pnpm --filter @apilens/next-sdk test
      - run: pnpm --filter @apilens/next-sdk build
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./sdks/next/package.json').version")
          test "next-sdk-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - name: Pack
        working-directory: sdks/next
        run: |
          pnpm pack
          sha256sum apilens-next-sdk-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apilens-next-sdk
          path: |
            sdks/next/apilens-next-sdk-*.tgz
            sdks/next/SHA256SUMS.txt
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "@apilens/next-sdk ${GITHUB_REF_NAME#next-sdk-v}" --notes "See sdks/next/README.md for what changed and how to install."
          gh release upload "${GITHUB_REF_NAME}" sdks/next/apilens-next-sdk-*.tgz sdks/next/SHA256SUMS.txt --clobber
